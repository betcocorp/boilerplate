name: "Release"

on:
  push:
    # main -> stable release; staging/dev -> prerelease channels (x.y.z-staging.N / x.y.z-dev.N)
    branches: [ "main", "staging", "dev" ]
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: "Run semantic-release in --dry-run mode (no tag / commit / release)"
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Pinned to betcocorp/github-actions deb64da (main).
    uses: betcocorp/github-actions/.github/workflows/release.yml@deb64da324e8e5c22c2f5d0998e8497244428623
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
